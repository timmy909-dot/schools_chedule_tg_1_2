            color: white;
        }
        .eat td {
    background-color: #f0f8ff;

    white-space: nowrap;
}
/* 반응형 디자인*/

    .table-container{
        flex-direction:column;
        align-items:center;
    }

    .table-scroll{
        width:100%;
        overflow-x:auto;
    }

    .schedule{
        min-width:700px;
    }

/*메뉴 스타일*/
.menu{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:15px;
    margin:25px 0;
    flex-wrap:wrap;
}
/*메뉴 제목 스타일*/
h1{
    text-align:center;
    margin-top:20px;
    margin-bottom:20px;
}
/*전체 너비 제한*/
.all{
    max-width:1400px;
    margin:auto;
    padding:20px;
}
/*body 여백 제거*/
body{
    margin:0;
}
/*테이블 컨테이너 스타일*/
.table-container{
    display:flex;
    align-items:flex-start;
    gap:50px;
}
/*전체 스타일*/
.all{
    max-width:1400px;
    margin:auto;
    padding:20px;
}




/* =========================
   노트 + 쉬는 시간
========================= */

.bottom-container {

    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(0, 1fr);

    gap: 70px;

    align-items: stretch;

    margin-top: 30px;

    width: 100%;

}


/* =========================
   my note
========================= */

.note-box {

    width: 100%;

    min-height: 300px;

    box-sizing: border-box;

    padding: 20px;

    border: 1px solid #66ccff;

    background-color: #f0f8ff;

}


.note-box h3 {

    margin-top: 0;

    color: #000f9a;

    font-size: 28px;

}


.note-input-area {

    display: flex;

    gap: 8px;

}


#noteInput {

    flex: 1;

    min-width: 0;

    padding: 10px;

    box-sizing: border-box;

    font-size: 16px;

}


.note-input-area button {

    padding: 10px 15px;

}


#noteList {

    padding-left: 25px;

}


#noteList li {

    margin-top: 12px;

}



/* =========================
   🎮 쉬는 시간
========================= */

.break-box {

    width: 100%;

    min-height: 500px;

    box-sizing: border-box;

    padding: 20px;

    border: 1px solid #66ccff;

    background-color: #f0f8ff;

}


.break-box h2 {

    margin-top: 0;

    color: #000f9a;

    font-size: 30px;

}


/* 게임 선택 */

.game-select-area {

    display: flex;

    align-items: center;

    gap: 10px;

    margin-bottom: 30px;

}


#gameSelect {

    padding: 8px;

    font-size: 16px;

}


/* 게임 영역 */

#gameArea {

    min-height: 340px;

}


/* 반응속도 게임 */

#reactionGame {

    text-align: center;

}


#reactionText {

    font-size: 25px;

    font-weight: bold;

    margin-top: 50px;

    margin-bottom: 30px;

}


#reactionTime {

    font-size: 18px;

    margin-bottom: 30px;

}


/* 반응속도 이스터에그 */

#reactionEgg {

    font-size: 20px;

    font-weight: bold;

    margin-bottom: 25px;

    padding: 12px 16px;

    border-radius: 12px;

    background: linear-gradient(90deg, #ffe259, #ffa751);

    color: #4a2c00;

    animation: eggPop 0.4s ease;

}

@keyframes eggPop {

    from { transform: scale(0.7); opacity: 0; }

    to { transform: scale(1); opacity: 1; }

}


/* 반응속도 버튼 */

#reactionButton {

    width: 100%;

    height: 180px;

    font-size: 30px;

    font-weight: bold;

    cursor: pointer;

    border: 1px solid #66ccff;

    background-color: white;

    color: #000f9a;

}




/* =========================
   모바일
========================= */

@media (max-width: 768px) {}

/* =========================
   시간표 + 급식표
========================= */

.table-container {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        minmax(500px, 1fr);

    gap: 70px;

    align-items: start;
}


/* =========================
   모바일 최종 수정
========================= */

@media (max-width: 768px) {

    /* 시간표 + 급식표 */
    .table-container {

        display: flex;

        flex-direction: column;

        align-items: stretch;

        gap: 20px;

        width: 100%;

    }


    /* 시간표 가로 스크롤 */
    .table-scroll {

        width: 100%;

        overflow-x: auto;

    }


    /* 시간표 자체 크기 유지 */
    .schedule {

        min-width: 700px;

    }


    /* 급식표 */
    .eat {

        width: 100%;

        min-width: 0;

        margin-top: 0;

    }


    /* 노트 + 쉬는 시간 */
    .bottom-container {

        display: flex;

        flex-direction: column;

        gap: 20px;

        width: 100%;

    }


    /* 노트 */
    .note-box {

        width: 100%;

        min-height: 200px;

    }


    /* 쉬는 시간 */
    .break-box {

        width: 100%;

        min-height: 450px;

    }

}


/* =========================
   급식표 가로 스크롤
========================= */

/* 급식표가 들어있는 오른쪽 영역 */

.right-panel {

    width: 100%;

    min-width: 0;

    overflow: visible;

}


/* 스크롤 영역 */

.meal-scroll {

    width: 100%;

    max-width: 100%;

    overflow-x: auto;

    overflow-y: hidden;

    box-sizing: border-box;

    padding-bottom: 15px;

}


/* 실제 급식표 */

.meal-scroll .eat {

    width: max-content;

    min-width: 700px;

    border-collapse: collapse;

}

/* 모바일 */

@media (max-width: 768px) {

    .meal-scroll {

        width: 100%;

        max-height: 400px;

        overflow-x: auto;

        overflow-y: auto;

    }


    .meal-scroll .eat {

        min-width: 700px;

    }

}


/* =========================
   급식표 가로 스크롤
========================= */

.right-panel {

    width: 500px;

    min-width: 0;

}


.meal-scroll {

    width: 100%;

    max-width: 100%;

    overflow-x: auto;

    overflow-y: hidden;

    box-sizing: border-box;

}


/* 실제 급식표 */

.meal-scroll .eat {

    width: max-content;

    min-width: 1000px;

    margin: 0;

}

/* =========================
   다크모드 디자인 수정본
   - 전체 배경: 검은색
   - 상단 제목/메뉴 UI: 흰색 중심
   - 시간표/급식표/노트/쉬는 시간: 밝은 패널
   - 패널 내부 글자: 검은색
========================= */
body.dark-mode {
    background: #000 !important;
    color: #fff !important;
}

body.dark-mode .all {
    background: transparent !important;
}

/* 학교 알리미 제목 */
body.dark-mode h1 {
    color: #fff !important;
}

/* 학교 선택 등 상단 메뉴 */
body.dark-mode .menu label {
    color: #fff !important;
}

body.dark-mode .menu select,
body.dark-mode #themeToggle {
    background: #fff !important;
    color: #000 !important;
    border: 1px solid #ddd !important;
}

/* 시간표와 급식표를 밝은 색으로 */
body.dark-mode .schedule,
body.dark-mode .eat {
    background: #f7f7f7 !important;
}

body.dark-mode .schedule th,
body.dark-mode .eat th {
    background: #fff !important;
    color: #000 !important;
    border-color: #aaa !important;
}

body.dark-mode .schedule td,
body.dark-mode .eat td {
    background: #f2f2f2 !important;
    color: #000 !important;
    border-color: #aaa !important;
}

body.dark-mode .schedule th,
body.dark-mode .schedule td,
body.dark-mode .eat th,
body.dark-mode .eat td {
    color: #000 !important;
}

/* 노트와 쉬는 시간을 더 밝게 */
body.dark-mode .note-box,
body.dark-mode .break-box {
    background: #f5f5f5 !important;
    color: #000 !important;
    border-color: #ddd !important;
}

body.dark-mode .note-box h3,
body.dark-mode .break-box h2,
body.dark-mode .note-box p,
body.dark-mode .break-box p,
body.dark-mode .note-box label,
body.dark-mode .break-box label,
body.dark-mode #timicraftGame,
body.dark-mode #reactionGame,
body.dark-mode #reactionText,
body.dark-mode #reactionTime,
body.dark-mode #noteList,
body.dark-mode #noteList li {
    color: #000 !important;
}

/* 패널 안의 입력창과 버튼 */
body.dark-mode .note-box input,
body.dark-mode .note-box button,
body.dark-mode .break-box select,
body.dark-mode .break-box button {
    background: #fff !important;
    color: #000 !important;
    border-color: #aaa !important;
}

/* 게임 실행 버튼은 보기 좋게 유지 */
body.dark-mode #openTimicraftBtn {
    background: #fff !important;
    color: #000 !important;
    border-color: #aaa !important;
}

/* 링크 */
body.dark-mode a {
    color: #fff !important;
}

/* 현재 시간표 강조는 밝은 배경에서도 잘 보이게 유지 */
body.dark-mode .today-cell {
    background: #fff59d !important;
    color: #000 !important;
}

body.dark-mode .current-class {
    background: #b9f6ca !important;
    color: #000 !important;
}



/* =========================================================
   화면 디자인 개선 - 한눈에 보는 시간표 + 급식표
========================================================= */

/* 전체 상단을 화면 중앙에 정리 */
h1 {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: -1px;
}

h1::before {
    content: "🏫 ";
}

.menu {
    gap: 12px;
    margin: 18px 0 10px;
}

.menu label {
    font-size: 16px;
}

.menu select,
#themeToggle {
    height: 32px;
    padding: 4px 9px;
}

/* 티미크래프트 빠른 실행 버튼 */


#quickTimicraftBtn:hover {
    filter: brightness(.92);
}

/* PC에서는 시간표와 급식표가 한 화면에 깔끔하게 들어오도록 */
.table-container {
    display: grid !important;
    grid-template-columns: 450px minmax(0, 1fr);
    gap: 20px !important;
    align-items: start;
    width: 100%;
}

.table-scroll,
.meal-scroll {
    width: 100%;
    overflow: visible;
}

.right-panel {
    width: auto !important;
    min-width: 0;
}

/* 시간표: 왼쪽에 컴팩트하게 */
.schedule {
    width: 100% !important;
    min-width: 0 !important;
    table-layout: fixed;
}

.schedule th,
.schedule td {
    padding: 9px 6px;
    font-size: 15px;
    line-height: 1.35;
    white-space: normal;
}

.schedule th:first-child,
.schedule td:first-child {
    width: 50px;
}

/* 급식표: 오른쪽 넓은 영역을 전부 사용 */
.eat,
.meal-scroll .eat {
    width: 100% !important;
    min-width: 0 !important;
    table-layout: fixed;
}

.eat th,
.eat td {
    padding: 9px 8px;
    font-size: 15px;
    line-height: 1.45;
}

.eat th:first-child {
    width: 58px;
}

.eat td {
    white-space: pre-line !important;
    overflow-wrap: anywhere;
    vertical-align: top;
}

/* 다크 모드: 스크린샷과 같은 구성 */
body.dark-mode {
    background: #202020 !important;
}

body.dark-mode h1,
body.dark-mode .menu label {
    color: #fff !important;
}

body.dark-mode .menu select,
body.dark-mode #themeToggle {
    background: #fff !important;
    color: #111 !important;
    border: 1px solid #d7d7d7 !important;
}

/* 표는 밝게, 글자는 검게 해서 한눈에 읽히게 */
body.dark-mode .schedule,
body.dark-mode .eat {
    background: #e8edf2 !important;
}

body.dark-mode .schedule th,
body.dark-mode .eat th {
    background: #36536b !important;
    color: #fff !important;
    border-color: #6e91aa !important;
    font-weight: 700;
}

body.dark-mode .schedule td,
body.dark-mode .eat td {
    background: #dce5ed !important;
    color: #111 !important;
    border-color: #8d9ca8 !important;
}

/* 오늘/현재 교시는 더 눈에 띄게 */
body.dark-mode .today-cell {
    background: #fff176 !important;
    color: #111 !important;
}

body.dark-mode .current-class {
    background: #a5f3a8 !important;
    color: #111 !important;
}

/* 아래 카드도 밝고 읽기 쉽게 */
body.dark-mode .note-box,
body.dark-mode .break-box {
    background: #eef2f5 !important;
    color: #111 !important;
    border-color: #9aa8b5 !important;
}

body.dark-mode .note-box h3,
body.dark-mode .break-box h2,
body.dark-mode .note-box *,
body.dark-mode .break-box * {
    color: #111;
}

body.dark-mode .note-box input,
body.dark-mode .note-box button,
body.dark-mode .break-box select,
body.dark-mode .break-box button {
    background: #fff !important;
    color: #111 !important;
}

/* 모바일에서는 세로 배치 + 필요한 경우에만 가로 스크롤 */
@media (max-width: 900px) {
    .table-container {
        grid-template-columns: 1fr;
        gap: 22px !important;
    }

    .table-scroll,
    .meal-scroll {
        overflow-x: auto;
    }

    .schedule {
        min-width: 620px !important;
    }

    .eat,
    .meal-scroll .eat {
        min-width: 720px !important;
    }
}

@media (max-width: 600px) {
    .all { padding: 12px; }

    h1 { font-size: 28px; }

    .menu { gap: 8px; }

    .menu label { font-size: 14px; }

    #quickTimicraftBtn {
        width: 100%;
        max-width: 340px;
    }
}

// (워커의 schoolInfo 타입을 통해 검색 -> 교육청 코드/학교 코드/학교급을 자동으로 가져옴)
let selectedSchool = {
    name: "옥정중학교",
    office: "J10",
    code: "7602133",
    level: "mis" // els: 초등학교, mis: 중학교, his: 고등학교
};

// 검색 결과 캐시: 화면에 보여준 문자열("학교명 (지역)") -> 학교 정보

function createScheduleTable(periods = 7) {

    scheduleBody.innerHTML = "";

    for (let i = 1; i <= periods; i++) {

        const row = document.createElement("tr");

        row.innerHTML = `
            <th>${i}교시</th>
            <td id="mon${i}"></td>
            <td id="tue${i}"></td>
            <td id="wed${i}"></td>
            <td id="thu${i}"></td>
            <td id="fri${i}"></td>
        `;

        scheduleBody.appendChild(row);
    }
}


// =========================
// 이번주 월~금 날짜 구하기
// =========================

function getWeekDates(){

    const today=new Date();

    const day=today.getDay();

    const monday=new Date(today);

    monday.setDate(today.getDate()-(day===0?6:day-1));

    const result=[];

    for(let i=0;i<5;i++){

        const d=new Date(monday);

        d.setDate(monday.getDate()+i);

        const y=d.getFullYear();

        const m=String(d.getMonth()+1).padStart(2,"0");

        const dd=String(d.getDate()).padStart(2,"0");

        result.push(`${y}${m}${dd}`);

    }

    return result;

}

// =========================
// NEIS에서 시간표 불러오기
// =========================


const API_BASE="https://school-notice.ti4762562.workers.dev/";const API_TIMEOUT=10000;let timetableRequestId=0;let mealRequestId=0;async function fetchJson(url,timeout=API_TIMEOUT){const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error(`HTTP 오류: ${r.status}`);return await r.json();}finally{clearTimeout(t)}}function makeApiUrl(type,params){const u=new URL(API_BASE);u.searchParams.set("type",type);for(const [k,v] of Object.entries(params))u.searchParams.set(k,v);return u.toString()}

async function loadTimetable() {
    const requestId = ++timetableRequestId;

    createScheduleTable();

    const info = selectedSchool;
    const grade = gradeSelect.value;
    const cls = classSelect.value;

    if (!info || !info.office || !info.code || !cls) {
        return;
    }

    const week = getWeekDates();
    const dayIds = ["mon", "tue", "wed", "thu", "fri"];

    // 🔧 추가: 요일 헤더의 날짜를 매번 이번 주 기준으로 갱신
    week.forEach((date, d) => {
        const formatted = date.substring(4, 6) + "/" + date.substring(6, 8);
        const headerEl = document.getElementById(`schedule-date-${dayIds[d]}`);
        if (headerEl) headerEl.textContent = formatted;
    });

    const timetableKey = `${info.level || "mis"}Timetable`;

    // 5일을 동시에 요청해서 기존의 순차 요청보다 빠르게 로딩
    const requests = week.map((date, d) => {
        const url = makeApiUrl("timetable", {
            office: info.office,
            school: info.code,
            level: info.level || "mis",
            grade,
            class: cls,
            date
        });

        return fetchJson(url)
            .then(data => ({ data, d, date }))
            .catch(error => ({ error, d, date }));
    });

    const results = await Promise.all(requests);

    // 사용자가 학교/학년/반을 바꿨다면 오래된 응답 무시
    if (requestId !== timetableRequestId) {
        return;
    }

    results.forEach(({ data, error, d, date }) => {
        if (error) {
            console.error(`${date} 시간표 오류:`, error);
            return;
        }

        const rows = data?.[timetableKey]?.[1]?.row;

        if (!Array.isArray(rows)) {
            return;
        }

        rows.forEach(item => {
            const period = Number(item.PERIO);
            const cell = document.getElementById(`${dayIds[d]}${period}`);

            if (cell) {
                cell.textContent = item.ITRT_CNTNT || "-";
            }
        });
    });

    highlightTodayAndCurrentClass();
}

async function loadMeals() {
    const requestId = ++mealRequestId;

    const info = selectedSchool;

    if (!info || !info.office || !info.code) return;

    const week = getWeekDates();
    const mealDays = ["mon", "tue", "wed", "thu", "fri"];

    // 먼저 상태 초기화
    mealDays.forEach(day => {
        document.getElementById(`meal-${day}`).textContent = "불러오는 중...";
    });

    // 오늘 급식 칸 강조
    highlightTodayMeal();

    const requests = week.map((date, d) => {
        const formattedDate =
            date.substring(4, 6) + "/" + date.substring(6, 8);

        document.getElementById(`meal-date-${mealDays[d]}`).textContent =
            formattedDate;

        const url = makeApiUrl("meal", {
            office: info.office,
            school: info.code,
            date
        });

        return fetchJson(url)
            .then(data => ({ data, d, date }))
            .catch(error => ({ error, d, date }));
    });

    const results = await Promise.all(requests);

    if (requestId !== mealRequestId) {
        return;
    }

    results.forEach(({ data, error, d, date }) => {
        const target = document.getElementById(`meal-${mealDays[d]}`);

        if (error) {
            console.error(`${date} 급식 오류:`, error);
            target.textContent = "불러오기 실패";
            return;
        }

        const rows = data?.mealServiceDietInfo?.[1]?.row;

        if (!Array.isArray(rows)) {
            target.textContent = "급식 없음";
            return;
        }

        const lunch = rows.find(
            item => item.MMEAL_SC_CODE === "2"
        );

        if (!lunch || !lunch.DDISH_NM) {
            target.textContent = "급식 없음";
            return;
        }

        // API의 <br>을 실제 줄바꿈으로 바꾸고 textContent로 출력
        // → 외부 데이터가 HTML로 실행되는 문제 방지
        target.textContent = lunch.DDISH_NM
            .replace(/<br\s*\/?>/gi, "\n")
            .replace(/\s*\([^)]*\)/g, match => match);
    });
}

const classTimes = [
    { start: [9, 0], end: [9, 45] },       // 1교시
    { start: [9, 55], end: [10, 40] },     // 2교시
    { start: [10, 50], end: [11, 35] },    // 3교시
    { start: [11, 45], end: [12, 30] },    // 4교시

];

function setupClassNotifications() {

    const now = new Date();

    classTimes.forEach((cls, index) => {

        const startTime = new Date();

        startTime.setHours(
            cls.start[0],
            cls.start[1],
            0,
            0
        );

        const diff = startTime.getTime() - now.getTime();

        if (diff > 300000) {

            setTimeout(() => {

                alert(
                    `${index + 1}교시 시작 5분 전입니다! 준비하세요 📚`
                );

            }, diff - 300000);

        }

    });

}

// =========================
// 현재 요일 / 현재 교시 하이라이트
// =========================

function highlightTodayAndCurrentClass() {

    const now = new Date();
    const dayNames = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
    const today = dayNames[now.getDay()];
    const weekdays = ["mon", "tue", "wed", "thu", "fri"];

    // 기존 강조 제거
    weekdays.forEach(day => {
        for (let i = 1; i <= 7; i++) {
            const cell = document.getElementById(`${day}${i}`);
            if (cell) cell.classList.remove("today-cell", "current-class");
        }
    });

    // 주말이면 종료
    if (!weekdays.includes(today)) return;

    // 오늘 요일 전체 강조
    for (let i = 1; i <= 7; i++) {
        const cell = document.getElementById(`${today}${i}`);
        if (cell) cell.classList.add("today-cell");
    }

    // 현재 교시 강조
    const nowMinutes = now.getHours() * 60 + now.getMinutes();

    classTimes.forEach((time, index) => {
        const startMinutes = time.start[0] * 60 + time.start[1];
        const endMinutes = time.end[0] * 60 + time.end[1];

        if (nowMinutes >= startMinutes && nowMinutes < endMinutes) {
            const cell = document.getElementById(`${today}${index + 1}`);
            if (cell) cell.classList.add("current-class");
        }
    });
}

// 1분마다 현재 교시 확인
setInterval(highlightTodayMeal, 60000);
setInterval(highlightTodayAndCurrentClass, 60000);

function highlightTodayMeal() {
    const dayNames = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"];
    const today = dayNames[new Date().getDay()];

    ["mon", "tue", "wed", "thu", "fri"].forEach(day => {
        const isToday = day === today;
        const dateCell = document.getElementById(`meal-date-${day}`);
        const mealCell = document.getElementById(`meal-${day}`);

        if (dateCell) dateCell.classList.toggle("meal-today", isToday);
        if (mealCell) mealCell.classList.toggle("meal-today", isToday);
    });
}

function updateClass(){

    // 학교마다 반 수가 달라 정확한 값을 미리 알 수 없으므로,
    // 넉넉한 범위를 제공하고 사용자가 직접 선택하도록 합니다.

    const previousValue = classSelect.value;

    classSelect.innerHTML = "";

    for(let i = 1; i <= MAX_CLASS; i++){

        const option = document.createElement("option");

        option.value = i;

}

// =========================

function debounce(fn, delay) {
    let timer = null;
    return (...args) => {
        clearTimeout(timer);
        timer = setTimeout(() => fn(...args), delay);
    };
}

const schoolListEl = document.getElementById("schoolList");

async function searchSchools(name) {
    if (!name || name.trim().length < 2) return [];
    try {
        const url = makeApiUrl("schoolInfo", { name: name.trim() });
        const list = await fetchJson(url);
        return Array.isArray(list) ? list : [];
    } catch (error) {
        console.error("학교 검색 오류:", error);
        return [];
    }
}

function schoolLabel(item) {
    const region = (item.officeName || "").replace("교육청", "");
    return `${item.name} (${region})`;
}

const handleSchoolSearchInput = debounce(async () => {
    const query = schoolSelect.value.trim();
    const results = await searchSchools(query);

    schoolListEl.innerHTML = "";
    schoolSearchCache.clear();

    results.forEach(item => {
        const label = schoolLabel(item);
        schoolSearchCache.set(label, item);

        const option = document.createElement("option");
        option.value = label;
        schoolListEl.appendChild(option);
    });
}, 300);

function loadSelectedSchool() {
    const label = schoolSelect.value.trim();
    const item = schoolSearchCache.get(label);
    if (!item) return;

    selectedSchool = {
        name: item.name,
        office: item.office,
        code: item.code,
        level: item.level || "mis"
    };

    updateClass();
    loadTimetable();
    loadMeals();
}

schoolSelect.addEventListener("input", () => {
    const label = schoolSelect.value.trim();
    if (schoolSearchCache.has(label)) {
        loadSelectedSchool();
    } else {
        handleSchoolSearchInput();
    }
});
schoolSelect.addEventListener("change", loadSelectedSchool);

gradeSelect.addEventListener("change", () => {

    updateClass();

    loadTimetable();

});

// =========================
// 티미크래프트 화면 고정/해제 (` 키)
// =========================
(function setupTimicraftScreenLock() {
    // 티미크래프트를 열면 기본적으로 화면 고정 상태로 시작합니다.
    // 백틱을 한 번 누르면 고정이 풀리고, 다시 누르면 다시 고정됩니다.
    let screenLocked = true;

    function isTypingTarget(target) {
        if (!target) return false;
        const tag = target.tagName;
        return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" ||
               target.isContentEditable;
    }

    function findTimicraftModal() {
        // 티미크래프트 관련 iframe을 찾아 가장 가까운 모달/컨테이너를 사용
        const iframe = Array.from(document.querySelectorAll("iframe"))
            .find(el => /티미크래프트|timicraft/i.test(
                (el.title || "") + " " + (el.src || "")
            ));

        if (!iframe) return null;

        return iframe.closest(".modal, .game-modal, .game-container, .game, [role='dialog']")
            || iframe.parentElement;
    }

    function findGameModalEl() {
        return document.getElementById("gameModal");
    }

    function setScreenLock(locked) {
        screenLocked = locked;
        const modal = findTimicraftModal();

        if (!modal) return;

        modal.classList.toggle("timicraft-screen-locked", locked);
        document.body.classList.toggle("timicraft-lock-active", locked);

        if (locked) {
            modal.dataset.previousOverflow = document.body.style.overflow;
            document.body.style.overflow = "hidden";
        } else {
            document.body.style.overflow =
                modal.dataset.previousOverflow || "";
        }
    }

    function handleKeydown(event) {
        // 백틱(`) 키만 사용
        if (event.key !== "`" || isTypingTarget(event.target)) return;

        // 티미크래프트 화면이 실제로 열려 있을 때만 작동
        const gameModalEl = findGameModalEl();
        if (!gameModalEl || !gameModalEl.classList.contains("open")) return;

        event.preventDefault();
        setScreenLock(!screenLocked);
    }

    // 최상위 문서(모달 바깥, 닫기 버튼 등에 포커스가 있을 때)
    document.addEventListener("keydown", handleKeydown, true);

    // 게임은 iframe 안에서 실행되므로, 게임 화면(캔버스)에 포커스가 가 있으면
    // 위 최상위 document 리스너로 키 입력이 전달되지 않습니다.
    // iframe 내부 문서에도 같은 핸들러를 연결해 어디에 포커스가 있든 동작하게 합니다.
    function bindIframeKeydown() {
        const iframe = document.getElementById("gameFrame");
        if (!iframe) return;
        try {
            const idoc = iframe.contentDocument;
            if (idoc && !idoc.__timicraftLockBound) {
                idoc.addEventListener("keydown", handleKeydown, true);
                idoc.__timicraftLockBound = true;
            }
        } catch (e) {
            // 접근이 불가능한 경우 무시
        }
    }

    const gameFrameEl = document.getElementById("gameFrame");
    if (gameFrameEl) {
        gameFrameEl.addEventListener("load", bindIframeKeydown);
    }

    // 외부에서 사용할 수 있도록 전역 함수도 제공
    window.toggleTimicraftScreenLock = () => {
        setScreenLock(!screenLocked);
    };

    // 게임을 열고 닫을 때 고정 상태를 강제로 지정할 때 사용
    window.setTimicraftScreenLock = (locked) => {
        setScreenLock(locked);
    };

    window.isTimicraftScreenLocked = () => screenLocked;
})();

// 노트 추가 (욕설 입력 막기 적용)
function addNote() {
    const input = document.getElementById("noteInput");
    const noteText = input.value.trim();
    if (noteText === "") return;

    // 욕설 검사
    if (bannedWords.some(word => noteText.includes(word))) {
        alert("⚠️ 입력할 수 없는 표현이 포함되어 있습니다.상대방을 배려하는 표현으로 다시 작성해 주세요. 😊")
        input.value = ""; // 입력창 비우기
        return; // 저장 및 추가 중단
    }

    createNoteElement(noteText);
    saveNotes();
    input.value = "";
}

// 노트 요소 생성
function createNoteElement(text) {
    const li = document.createElement("li");
    li.textContent = text;

    const delBtn = document.createElement("button");
    delBtn.textContent = "삭제";
    delBtn.style.marginLeft = "10px";
    delBtn.onclick = function() {
        li.remove();
        saveNotes();
    };

    li.appendChild(delBtn);
    document.getElementById("noteList").appendChild(li);
}

// 노트 저장
function saveNotes() {
    const items = document.querySelectorAll("#noteList li");
    const notes = [];
    items.forEach(li => {
        // 버튼 텍스트 제외하고 노트 내용만 저장
        notes.push(li.firstChild.textContent);
    });
    localStorage.setItem("notes", JSON.stringify(notes));
}

let reactionState = "idle";

let reactionStartTime = null;

let reactionTimer = null;



function startReactionGame() {

    const button =
        document.getElementById(
            "reactionButton"
        );


    const text =
        document.getElementById(
            "reactionText"
        );


    // 시작

    if (
        reactionState === "idle"
    ) {

        reactionState =
            "waiting";


        button.textContent =
            "기다리세요...";


        button.style.backgroundColor =
            "#dddddd";


        text.textContent =
            "준비하세요...";


        // 2~5초 랜덤 대기

        const randomTime =
            Math.random() * 3000 +
            2000;


        reactionTimer =
            setTimeout(

                function () {

                    reactionState =
                        "ready";


                    reactionStartTime =
                        performance.now();


                    button.textContent =
                        "지금 클릭!";


                    button.style.backgroundColor =
                        "#7CFC00";


                    text.textContent =
                        "지금!";

                },

                randomTime

            );


        return;

    }


    // 너무 빨리 클릭

    if (
        reactionState === "waiting"
    ) {

        clearTimeout(
            reactionTimer
        );


        reactionState =
            "idle";


        button.textContent =
            "다시 시작";


        button.style.backgroundColor =
            "#ffcccc";


        text.textContent =
            "너무 빨라요!";


        return;

    }


    // 정상 클릭

    if (
        reactionState === "ready"
    ) {

        const reactionEndTime =
            performance.now();


        const result =
            reactionEndTime -
            reactionStartTime;


        const seconds =
            (
                result / 1000
            ).toFixed(3);


        text.textContent =
            `반응속도: ${seconds}초`;

        showReactionEasterEgg(seconds);


        button.textContent =
            "다시 시작";


        button.style.backgroundColor =
            "white";


        reactionState =
            "idle";


        // 최고 기록 확인

        const best =
            localStorage.getItem(
                "reactionBest"
            );


        if (
            !best ||
            result < Number(best)
        ) {

            localStorage.setItem(
                "reactionBest",
                result
            );


            document
                .getElementById(
                    "reactionTime"
                )
                .textContent =
                `🏆 최고 기록: ${seconds}초`;

        }

    }

}

function openTimicraft(){try{if(!gameFrame.srcdoc){const bytes=Uint8Array.from(atob(gameData),c=>c.charCodeAt(0));gameFrame.srcdoc=new TextDecoder("utf-8").decode(bytes);}gameModal.classList.add("open");gameModal.setAttribute("aria-hidden","false");if(window.setTimicraftScreenLock)window.setTimicraftScreenLock(true);}catch(e){console.error(e);alert("티미크래프트를 실행하지 못했습니다.");}}function closeTimicraft(){gameModal.classList.remove("open");gameModal.setAttribute("aria-hidden","true");if(window.setTimicraftScreenLock)window.setTimicraftScreenLock(false);}openTimicraftBtn.addEventListener("click",openTimicraft);closeGameBtn.addEventListener("click",closeTimicraft);gameModal.addEventListener("click",e=>{if(e.target===gameModal)closeTimicraft();});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&gameModal.classList.contains("open"))closeTimicraft();});
